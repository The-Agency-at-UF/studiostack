name: Deploy Development

# Every push to main runs the full suite, then publishes the website to the
# AWS development environment. API, Lambda and database changes stay manual.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  suite:
    name: Full test suite
    uses: ./.github/workflows/test-suite.yml

  publish:
    name: Publish development website
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://dev.dvmmztb0u3m9g.amplifyapp.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::423563856930:role/studiostack-ci-dev-web
          aws-region: us-east-2
      - name: Build, publish and verify every route
        run: node --import=tsx scripts/publish-web.ts --apply-dev
