name: Database API PostgreSQL Tests

on:
  pull_request:
    paths:
      - 'backend/database/**'
      - 'infra/database/**'
      - 'src/api/database*'
      - 'src/api/privatePhotos*'
      - 'src/api/photo-storage*'
      - 'src/api/dev-auth*'
      - 'src/types/database-api.ts'
      - 'scripts/*database-api*.ts'
      - 'scripts/*dev*.ts'
      - 'package*.json'
      - '.github/workflows/database-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:database
      - run: npm run test:database:postgres
