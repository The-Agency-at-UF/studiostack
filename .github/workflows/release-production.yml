name: Release Production

# Publishes main to the production website automatically, once Deploy
# Development has passed the full suite and verified the same commit on dev.
# Run it by hand from main to republish the current main without a new push.
on:
  workflow_run:
    workflows:
      - Deploy Development
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish production website
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://main.dxs0q7vrz4oko.amplifyapp.com
    permissions:
      contents: read
      id-token: write
    steps:
      # workflow_run runs on the latest main; check out the commit dev verified.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::423563856930:role/studiostack-ci-prod-web
          aws-region: us-east-2
      - name: Build, publish and verify every route
        run: node --import=tsx scripts/publish-web.ts --apply-prod
